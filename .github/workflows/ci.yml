name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install environment manager
        run: python -m pip install uv==0.13.7
      - name: Install public locked dependencies
        run: uv sync --frozen --all-extras --group dev
      - name: Tests without provider credentials or hardware
        run: uv run --frozen pytest -q
      - name: Lint and compilation
        run: |
          uv run --frozen ruff check src tests scripts examples
          uv run --frozen python -m compileall -q src tests scripts examples
      - name: CLI and publication checks
        run: |
          uv run --frozen adapter-vlm-policy --help
          uv run --frozen python scripts/check_publication.py
      - name: Source, wheel and example Skill packaging
        if: matrix.python == '3.12'
        run: |
          uv build
          uv run --frozen python scripts/build_demo_skill.py
          uv run --frozen python scripts/check_archives.py

  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --frozen --all-extras --group dev
      - name: Audit locked runtime and optional dependencies
        run: |
          uv export --frozen --all-extras --no-dev --no-emit-project --output-file /tmp/requirements.txt
          uv run --frozen pip-audit --requirement /tmp/requirements.txt --require-hashes --disable-pip

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install detect-secrets==1.5.0
      - name: Secret scan without external verification requests
        run: |
          detect-secrets scan --all-files --no-verify --exclude-files '^(\.git|\.venv|\.audit|dist|build|\.pytest_cache|\.ruff_cache)/|^\.secrets\.baseline$' > /tmp/secrets.json
          python scripts/check_secret_findings.py /tmp/secrets.json
